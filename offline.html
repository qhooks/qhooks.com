<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090B0A"><script src="/theme.js"></script><title>Offline | QHooks</title>
<style>
/* The installed app's offline page. The service worker caches only this page and the app icon, so everything it needs
   is here: System A colours and type (Mona Sans when the browser still has it, the system sans otherwise).
   Day/night (2026-11-10): the device setting, or the site's stored qhooks.theme choice via theme.js when it's cached. */
@font-face { font-family: "Mona Sans"; src: url("/qx-a/fonts/mona-sans-latin.woff2") format("woff2"); font-weight: 200 900; font-stretch: 75% 125%; font-display: swap; }
:root { color-scheme: dark; --floor: #090B0A; --tx: #F4F1E9; --tx2: rgba(244,241,233,.70); --gold: #D2AD72; --gold-hi: #F0DAAE; --metal: linear-gradient(180deg, #F5E2B9 0%, #D9B57A 46%, #B38A4B 100%); --on-gold: #211505; --glow: rgba(210,173,114,.16); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { color-scheme: light; --floor: #F2F3F1; --tx: #0D100F; --tx2: rgba(13,16,15,.72); --gold: #8B6631; --gold-hi: #7A5726; --metal: linear-gradient(180deg, #E9CF9C 0%, #CFA662 50%, #A9803F 100%); --glow: rgba(139,102,49,.1); } }
:root[data-theme="light"] { color-scheme: light; --floor: #F2F3F1; --tx: #0D100F; --tx2: rgba(13,16,15,.72); --gold: #8B6631; --gold-hi: #7A5726; --metal: linear-gradient(180deg, #E9CF9C 0%, #CFA662 50%, #A9803F 100%); --glow: rgba(139,102,49,.1); }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: radial-gradient(60% 45% at 50% 30%, var(--glow), transparent 70%), var(--floor); color: var(--tx); font: 460 15.5px/1.5 "Mona Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; text-align: center; }
main { display: grid; justify-items: center; max-width: 340px; }
.line { width: 2px; height: 46px; background: linear-gradient(180deg, transparent, var(--gold-hi)); }
.coin { position: relative; width: 88px; height: 88px; border-radius: 50%; box-shadow: 0 0 0 3px var(--gold), 0 0 34px rgba(240,218,174,.35); overflow: hidden; }
.coin img { display: block; width: 100%; height: 100%; object-fit: cover; }
h1 { margin: 26px 0 10px; font-size: 34px; line-height: 1; font-weight: 840; font-stretch: 122%; letter-spacing: -.045em; }
p { margin: 0 0 24px; color: var(--tx2); }
a { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 24px; border-radius: 15px; background: var(--metal); color: var(--on-gold); font-weight: 740; font-size: 15px; text-decoration: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 8px 22px -10px rgba(210,173,114,.7); }
a:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
</style>
</head>
<body>
<main><span class="line" aria-hidden="true"></span><span class="coin"><img src="/app-icons/icon-192.png" alt=""></span><h1>You're offline</h1><p>QHooks needs a connection to show live prices and send trades.</p><a href="">Try again</a></main>
</body>
</html>
