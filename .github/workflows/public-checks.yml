name: Public source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Offline tests and integrity
        shell: bash
        run: |
          set -euo pipefail
          node --version
          python3 --version
          python3 -m unittest discover -s .ci -p 'test_*.py'
          python3 .ci/release-manifest.py verify --root . --manifest .well-known/qhooks-release.json
          node .ci/chain-copy-check.mjs .
          sh .ci/mirror-guard.sh .
          python3 .ci/secret-scan.py .
